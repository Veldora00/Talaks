<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talaks — Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,440;9..144,560&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#FFFFFF; --paper-warm:#FBF8F3; --peach:#FFEEE3;
    --ink:#161A20; --ink-dim:#5B6472; --ink-faint:#8B93A1;
    --line: rgba(22,26,32,0.10); --line-strong: rgba(22,26,32,0.18);
    --brand:#FF5A36; --brand-deep:#E8471F; --brand-ink:#FFFFFF; --teal:#1E9E82;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased; }
  .wrap{max-width:720px; margin:0 auto; padding:0 28px;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  nav{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-bottom:1px solid var(--line); }
  nav .row{ display:flex; align-items:center; justify-content:space-between; padding:18px 0; max-width:720px; margin:0 auto; padding-left:28px; padding-right:28px; }
  .brand{ font-family:var(--serif); font-size:22px; font-weight:640; text-decoration:none; color:var(--ink); }
  .brand:visited, .brand:link, .brand:hover{ color:var(--ink); }
  .brand span{color:var(--brand);}
  .back{ font-size:14px; color:var(--ink-dim); text-decoration:none; }
  .back:hover{ color:var(--ink); }

  article{ padding:56px 0 40px; }
  .post-meta{ font-size:12.5px; color:var(--ink-faint); letter-spacing:0.03em; text-transform:uppercase; margin-bottom:14px; }
  h1{ font-family:var(--serif); font-weight:440; font-size:clamp(30px,4vw,42px); margin:0 0 18px; letter-spacing:-0.015em; line-height:1.15; }
  .lede{ font-size:18px; color:var(--ink-dim); margin:0 0 40px; line-height:1.6; padding-bottom:32px; border-bottom:1px solid var(--line); }

  .body h2{ font-family:var(--serif); font-weight:500; font-size:24px; margin:40px 0 12px; letter-spacing:-0.01em; }
  .body p{ font-size:17px; margin:0 0 20px; line-height:1.75; }
  .body ul{ font-size:17px; padding-left:24px; margin:0 0 20px; }
  .body li{ margin-bottom:10px; line-height:1.7; }
  .body strong{ font-weight:600; color:var(--ink); }
  .body em{ color:var(--ink-faint); font-style:italic; font-size:14.5px; }
  .body a{ color:var(--brand-deep); }

  .cta-band{ background:var(--peach); border-radius:20px; padding:34px 36px; margin:20px 0 80px; }
  .cta-band h2{ font-family:var(--serif); font-weight:500; font-size:22px; margin:0 0 8px; }
  .cta-band p{ font-size:14.5px; color:var(--ink-dim); margin:0 0 20px; }
  .cta-band a{ display:inline-block; background:var(--brand); color:var(--brand-ink); padding:13px 26px; border-radius:999px; text-decoration:none; font-size:14.5px; font-weight:600; }
  .cta-band a:hover{ background:var(--brand-deep); }

  .more-posts{ border-top:1px solid var(--line); padding-top:30px; margin-bottom:70px; }
  .more-posts p.lbl{ font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 16px; }
  .more-posts a{ display:block; text-decoration:none; color:var(--ink); padding:14px 0; border-bottom:1px solid var(--line); font-size:16px; font-weight:600; }
  .more-posts a:hover{ color:var(--brand-deep); }

  .loading-note{ color:var(--ink-faint); font-size:14px; padding:80px 0; text-align:center; }

  .site-foot{ border-top:1px solid var(--line); padding:32px 0; }
  .foot-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; font-size:13px; color:var(--ink-faint); }
  .foot-links{ display:flex; gap:20px; flex-wrap:wrap; font-size:13.5px; }
  .foot-links a{ color:var(--ink-dim); text-decoration:none; }
  .foot-links a:hover{ color:var(--ink); }
</style>
</head>
<body>

<nav>
  <div class="row">
    <a href="index.html" class="brand">Tal<span>a</span>ks</a>
    <a href="blog.html" class="back">&larr; All posts</a>
  </div>
</nav>

<div class="wrap">
  <article id="article">
    <div class="loading-note">Loading…</div>
  </article>

  <div class="cta-band" id="cta" style="display:none;">
    <h2>Stop paying for depreciation.</h2>
    <p>Brand-new iPhone and Galaxy flagships on a fixed monthly plan. Free upgrades, free delivery.</p>
    <a href="catalog.html">See the devices</a>
  </div>

  <div class="more-posts" id="more" style="display:none;">
    <p class="lbl">Keep reading</p>
    <div id="more-list"></div>
  </div>
</div>

<footer class="site-foot">
  <div class="wrap foot-row">
    <div class="foot-links">
      <a href="blog.html">Journal</a>
      <a href="faq.html">FAQs</a>
      <a href="terms.html">Terms of Use</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="mailto:info@talaks.com">info@talaks.com</a>
    </div>
    <span>© 2026 Talaks. Sydney, Australia.</span>
  </div>
</footer>

<script>
  const supabaseClient = supabase.createClient(
    'https://asajwviusixmnoolawnb.supabase.co',
    'sb_publishable__KTvqClMNFPO2ZHkueUJmA_101Fl1_D'
  );

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function prettyDate(iso){
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-AU', { day:'numeric', month:'long', year:'numeric' });
  }

  function readingTime(body){
    const words = String(body || '').trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 200));
  }

  // Minimal markdown renderer. Everything is HTML-escaped FIRST, then a small
  // set of patterns is turned into tags — so post text can never inject markup,
  // even though only admins can write it.
  function renderBody(md){
    const inline = t => escapeHtml(t)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" rel="noopener">$1</a>');

    return String(md || '')
      .replace(/\r\n/g, '\n')
      .split(/\n{2,}/)
      .map(block => {
        const b = block.trim();
        if (!b) return '';
        if (b.startsWith('## ')) return '<h2>' + inline(b.slice(3)) + '</h2>';
        if (b.startsWith('# '))  return '<h2>' + inline(b.slice(2)) + '</h2>';
        if (/^[-*]\s/.test(b)){
          const items = b.split('\n')
            .filter(l => /^[-*]\s/.test(l.trim()))
            .map(l => '<li>' + inline(l.trim().replace(/^[-*]\s/, '')) + '</li>')
            .join('');
          return '<ul>' + items + '</ul>';
        }
        return '<p>' + inline(b).replace(/\n/g, '<br>') + '</p>';
      })
      .join('');
  }

  const slug = new URLSearchParams(window.location.search).get('slug');
  const article = document.getElementById('article');

  if (!slug){
    window.location.replace('blog.html');
  } else {
    supabaseClient
      .from('posts')
      .select('slug, title, excerpt, body, published_at, author')
      .eq('slug', slug)
      .eq('published', true)
      .maybeSingle()
      .then(({ data: post, error }) => {
        if (error) console.error(error);

        if (!post){
          article.innerHTML =
            '<h1>Post not found</h1>' +
            '<p class="lede">This post may have been moved or unpublished.</p>' +
            '<p><a href="blog.html" style="color:var(--brand-deep); font-weight:600;">Back to all posts →</a></p>';
          return;
        }

        document.title = 'Talaks — ' + post.title;
        const desc = document.createElement('meta');
        desc.name = 'description';
        desc.content = post.excerpt || '';
        document.head.appendChild(desc);

        article.innerHTML =
          '<div class="post-meta">' + prettyDate(post.published_at) + ' &middot; ' +
            readingTime(post.body) + ' min read &middot; ' + escapeHtml(post.author || 'Talaks') + '</div>' +
          '<h1>' + escapeHtml(post.title) + '</h1>' +
          (post.excerpt ? '<p class="lede">' + escapeHtml(post.excerpt) + '</p>' : '') +
          '<div class="body">' + renderBody(post.body) + '</div>';

        document.getElementById('cta').style.display = '';

        // Other published posts, newest first, excluding this one
        supabaseClient
          .from('posts')
          .select('slug, title')
          .eq('published', true)
          .neq('slug', slug)
          .order('published_at', { ascending: false })
          .limit(3)
          .then(({ data: others }) => {
            if (!others || others.length === 0) return;
            document.getElementById('more-list').innerHTML = others.map(o =>
              '<a href="post.html?slug=' + encodeURIComponent(o.slug) + '">' + escapeHtml(o.title) + '</a>'
            ).join('');
            document.getElementById('more').style.display = '';
          });
      });
  }
</script>

<script src="assets/auth.js"></script>
</body>
</html>
